[project]
name = "spike-bridge"
version = "0.1.0"
description = "SPIKE Control Studio local bridge: BLE gateway and Robot Host for desktop and Raspberry Pi"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bleak>=3.0,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spike_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
